<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poly</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Left Opera/Arc-style Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand-logo" id="brand-logo" title="Poly Tarayıcı">
          <img class="logo-dark-theme" src="../assets/icon.png" alt="Poly Tarayıcı" />
          <img class="logo-light-theme" src="../assets/icon-dark.png" alt="Poly Tarayıcı" />
        </div>

        <button class="side-btn" data-panel="ram" title="Poly Control (RAM & Uyku Modu)">
          <svg class="icon-ram" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
          </svg>
        </button>

        <button class="side-btn" data-panel="adblock" title="Reklam & İzleyici Engelleyici">
          <svg class="icon-shield" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </button>

        <button class="side-btn" data-panel="vpn" id="side-btn-vpn" title="Poly VPN (Fransa, Almanya, ABD)">
          <span class="vpn-btn-wrap" aria-hidden="true">
            <svg class="vpn-orbit" viewBox="0 0 32 32" width="28" height="28" fill="none">
              <circle cx="16" cy="16" r="12.5" stroke="currentColor" stroke-width="1.35" stroke-dasharray="16 6 4 6" stroke-linecap="round" />
              <circle cx="16" cy="3.5" r="2.1" fill="currentColor" />
            </svg>
            <span class="vpn-globe-emoji">🌍</span>
          </span>
        </button>

        <button class="side-btn" data-panel="autofill" id="side-btn-autofill" title="Oto Doldurma, Şifreler & İçe Aktar">
          <svg class="icon-key" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7.5" cy="15.5" r="4.5" />
            <path d="M10.8 12.2L20 3" />
            <path d="M16 7l3 3" />
            <path d="M18.5 4.5l2.5 2.5" />
          </svg>
        </button>

        <button class="side-btn" data-panel="bookmarks" title="Yer İmleri">
          <svg class="icon-bookmark" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
        </button>

        <button class="side-btn" data-panel="history" title="Geçmiş">
          <svg class="icon-history" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="12" x2="15.5" y2="14" />
            <line class="icon-minute-hand" x1="12" y1="12" x2="12" y2="6" />
          </svg>
        </button>

        <button class="side-btn" data-panel="downloads" id="side-btn-downloads" title="İndirmeler">
          <svg class="icon-downloads" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <g class="icon-dl-arrow">
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </g>
          </svg>
        </button>
      </div>

      <div class="sidebar-bottom">
        <button class="side-btn" data-panel="settings" title="Ayarlar">
          <svg class="icon-settings" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Column -->
    <div class="main-column">
      <!-- Top Chrome: Tab Strip + Nav Bar -->
      <header class="top-chrome">
        <div class="tab-bar">
          <div class="tabs-scroll" id="tabs-container"></div>
          <button class="new-tab-btn" id="btn-new-tab" title="Yeni Sekme (Ctrl+T)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
          <div class="window-drag-spacer"></div>
          <div class="window-controls">
            <button class="win-btn" id="win-min" title="Küçült">
              <svg viewBox="0 0 12 12" width="11" height="11"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg>
            </button>
            <button class="win-btn" id="win-max" title="Ekranı Kapla">
              <svg viewBox="0 0 12 12" width="11" height="11"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button class="win-btn win-close" id="win-close" title="Kapat">
              <svg viewBox="0 0 12 12" width="11" height="11"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.3"/></svg>
            </button>
          </div>
        </div>

        <div class="nav-bar">
          <div class="nav-actions">
            <button class="nav-btn" id="btn-back" title="Geri">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
                <polyline points="15 18 9 12 15 6" />
              </svg>
            </button>
            <button class="nav-btn" id="btn-forward" title="İleri">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>
            <button class="nav-btn" id="btn-reload" title="Yenile / Durdur">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2">
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
              </svg>
            </button>
            <button class="nav-btn" id="btn-home" title="Ana Sayfa">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              </svg>
            </button>
          </div>

          <form class="omnibox" id="omnibox-form">
            <span class="omnibox-icon" id="omnibox-security">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
            </span>
            <input
              type="text"
              id="omnibox-input"
              placeholder="Web adresi yazın veya arama yapın..."
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" class="omnibox-star" id="btn-bookmark" title="Yer İmlerine Ekle/Çıkar">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
              </svg>
            </button>
          </form>
        </div>

        <!-- Chrome-style Bookmarks Bar -->
        <div class="bookmarks-bar" id="bookmarks-bar"></div>
      </header>

      <!-- Workspace Area: Fullscreen WebContentsView Viewport (Overlay floats on top) -->
      <div class="workspace-area">
        <main class="viewport-placeholder" id="viewport-placeholder"></main>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
