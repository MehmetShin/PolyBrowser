<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poly Autofill</title>
  <style>
    :root {
      --accent: #7c5cff;
      --bg-card: #1b1e29;
      --bg-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.14);
      --text-primary: #eef0f7;
      --text-secondary: #98a0b8;
    }
    :root[data-theme='light'] {
      --bg-card: #ffffff;
      --bg-hover: #f1f4f9;
      --border: rgba(15, 23, 42, 0.14);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: var(--bg-card);
      overflow: hidden;
      width: 100%;
      height: 100%;
      user-select: none;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    .af-card {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: afIn 0.1s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    @keyframes afIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .af-list {
      max-height: 220px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .af-list::-webkit-scrollbar {
      width: 5px;
    }
    .af-list::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 99px;
    }
    .af-row {
      width: 100%;
      border: none;
      background: transparent;
      color: inherit;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .af-row:hover {
      background: var(--bg-hover);
    }
    .af-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(124, 92, 255, 0.14);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .af-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .af-primary {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }
    .af-secondary {
      font-size: 11.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-secondary);
    }
    .af-footer {
      border-top: 1px solid var(--border);
      padding: 4px 0;
    }
    .af-manage-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.1s ease;
    }
    .af-manage-btn:hover {
      background: var(--bg-hover);
    }
    .af-manage-btn svg {
      color: var(--text-secondary);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="af-card" id="af-card">
    <div class="af-list" id="af-list"></div>
    <div class="af-footer">
      <button type="button" class="af-manage-btn" id="af-manage">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
        </svg>
        <span>Şifreleri ve otomatik doldurmayı yönet...</span>
      </button>
    </div>
  </div>
  <script>
    const card = document.getElementById('af-card');
    const listEl = document.getElementById('af-list');
    const manageBtn = document.getElementById('af-manage');

    const KEY_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" /></svg>';
    const USER_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

    manageBtn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      window.polyAPI.autofillPopupManage();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.polyAPI.autofillPopupClose();
    });

    window.polyAPI.onAutofillPopupData((payload) => {
      if (!payload) return;
      if (payload.theme) {
        document.documentElement.setAttribute('data-theme', payload.theme === 'light' ? 'light' : 'dark');
      }
      if (payload.accentColor) {
        document.documentElement.style.setProperty('--accent', payload.accentColor);
      }

      const items = payload.items || [];
      listEl.innerHTML = '';

      if (items.length === 0) {
        window.polyAPI.resizeAutofillPopup(0);
        return;
      }

      items.forEach((item) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'af-row';

        const icon = document.createElement('div');
        icon.className = 'af-icon';
        icon.innerHTML = item.kind === 'credential' ? KEY_SVG : USER_SVG;

        const text = document.createElement('div');
        text.className = 'af-text';

        const prim = document.createElement('div');
        prim.className = 'af-primary';
        prim.textContent = item.primary || '';

        const sec = document.createElement('div');
        sec.className = 'af-secondary';
        sec.textContent = item.secondary || '';

        text.append(prim, sec);
        row.append(icon, text);

        row.addEventListener('mousedown', (e) => {
          e.preventDefault();
          window.polyAPI.autofillPopupPick(item);
        });

        listEl.appendChild(row);
      });

      const h = Math.min(310, Math.ceil(card.getBoundingClientRect().height));
      window.polyAPI.resizeAutofillPopup(h > 0 ? h : 110);
    });

    if (window.polyAPI.onThemeChanged) {
      window.polyAPI.onThemeChanged((theme) => {
        document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      });
    }
    if (window.polyAPI.onAccentChanged) {
      window.polyAPI.onAccentChanged((color) => {
        if (color) document.documentElement.style.setProperty('--accent', color);
      });
    }
  </script>
</body>
</html>
