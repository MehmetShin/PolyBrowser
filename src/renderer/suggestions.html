<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poly Suggestions</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: #181b26;
      overflow: hidden;
      width: 100%;
      height: 100%;
      user-select: none;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    :root[data-theme='light'] html,
    :root[data-theme='light'] body {
      background: #ffffff;
    }
    .suggestions-container {
      width: 100%;
      padding: 0;
      box-sizing: border-box;
    }
    .suggestions-card {
      background: #181b26;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      box-shadow: none;
      overflow: hidden;
      padding: 5px 0;
      animation: suggestIn 0.12s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    :root[data-theme='light'] .suggestions-card {
      background: #ffffff;
      border-color: rgba(15, 23, 42, 0.14);
      box-shadow: none;
    }
    @keyframes suggestIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .suggestion-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      cursor: pointer;
      color: #eef0f7;
      font-size: 13.5px;
      transition: background 0.1s ease;
    }
    :root[data-theme='light'] .suggestion-row {
      color: #0f172a;
    }
    .suggestion-row:hover,
    .suggestion-row.selected {
      background: rgba(255, 255, 255, 0.08);
    }
    :root[data-theme='light'] .suggestion-row:hover,
    :root[data-theme='light'] .suggestion-row.selected {
      background: #f1f4f9;
    }
    .suggestion-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9299b0;
      flex-shrink: 0;
    }
    :root[data-theme='light'] .suggestion-icon {
      color: #64748b;
    }
    .suggestion-icon svg {
      width: 15px;
      height: 15px;
    }
    .suggestion-icon img {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      object-fit: contain;
    }
    .suggestion-content {
      flex: 1;
      display: flex;
      align-items: baseline;
      gap: 8px;
      overflow: hidden;
      white-space: nowrap;
    }
    .suggestion-title {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #eef0f7;
    }
    :root[data-theme='light'] .suggestion-title {
      color: #0f172a;
    }
    .suggestion-sub {
      font-size: 11.5px;
      color: #7b849c;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    :root[data-theme='light'] .suggestion-sub {
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="suggestions-container">
    <div class="suggestions-card" id="suggestions-card"></div>
  </div>
  <script src="suggestions.js"></script>
</body>
</html>
