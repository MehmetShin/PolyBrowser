<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Güvenlik Uyarısı - Poly Tarayıcı</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: auto; }

    /* Crimson Dangerous Site Screen (Chrome-style red warning) */
    body.mode-danger {
      background: linear-gradient(155deg, #be1d1d 0%, #991616 60%, #7d1111 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    /* Cert Error Screen (Dark/Light aware) */
    body.mode-cert {
      background: #0d0f17;
      color: #eef0f7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    html.light body.mode-cert {
      background: #ffffff;
      color: #1e293b;
    }

    .wrap {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .icon-box {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .desc {
      font-size: 14.5px;
      line-height: 1.6;
      opacity: 0.92;
    }
    body.mode-cert .desc {
      color: #9ba3bc;
    }
    html.light body.mode-cert .desc {
      color: #475569;
    }

    .err-code {
      font-family: 'Cascadia Mono', Consolas, monospace;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      opacity: 0.72;
      margin-top: -6px;
    }

    .tip-box {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.5;
    }
    body.mode-danger .tip-box {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff5f5;
    }
    body.mode-cert .tip-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.22);
      color: #fca5a5;
    }
    html.light body.mode-cert .tip-box {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 99px;
      padding: 10px 22px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }
    button:active { transform: scale(0.97); }

    body.mode-danger .btn-primary {
      background: #ffffff;
      color: #991616;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    body.mode-danger .btn-primary:hover { opacity: 0.93; }
    body.mode-danger .btn-secondary {
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.45);
    }
    body.mode-danger .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    body.mode-cert .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    body.mode-cert .btn-primary:hover { background: #1d4ed8; }
    body.mode-cert .btn-secondary {
      background: transparent;
      color: #9ba3bc;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    html.light body.mode-cert .btn-secondary {
      color: #475569;
      border-color: rgba(15, 23, 42, 0.18);
    }

    .details-box {
      display: none;
      margin-top: 4px;
      padding: 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .details-box.open { display: block; }
    body.mode-danger .details-box {
      background: rgba(0, 0, 0, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    body.mode-cert .details-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    html.light body.mode-cert .details-box {
      background: #f8fafc;
      border-color: #e2e8f0;
    }

    .proceed-link {
      display: inline-block;
      margin-top: 10px;
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 600;
      opacity: 0.9;
    }
    .proceed-link:hover { opacity: 1; }
  </style>
</head>
<body class="mode-danger">
  <div class="wrap">
    <div class="icon-box" id="icon-box"></div>
    <h1 id="title">Tehlikeli site</h1>
    <p class="desc" id="desc"></p>
    <div class="err-code" id="err-code" style="display:none"></div>

    <div class="tip-box" id="tip-box">
      <span style="font-size:16px;line-height:1.2">🛡️</span>
      <span id="tip-text"></span>
    </div>

    <div class="actions">
      <button type="button" class="btn-secondary" id="btn-details">Ayrıntılar</button>
      <div style="display:flex;gap:10px;align-items:center;">
        <button type="button" class="btn-secondary" id="btn-back" style="display:none">Güvenliğe geri dön</button>
        <button type="button" class="btn-primary" id="btn-primary">Güvenliğe geri dön</button>
      </div>
    </div>

    <div class="details-box" id="details-box">
      <div id="details-text"></div>
      <a class="proceed-link" id="btn-proceed"></a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type') || 'danger';
    const targetUrl = params.get('url') || '';
    const host = params.get('host') || targetUrl;
    const reason = params.get('reason') || 'Bu site zararlı etkinlikler nedeniyle engellendi.';
    const errCode = params.get('err') || 'NET::ERR_CERT_AUTHORITY_INVALID';
    const issuer = params.get('issuer') || '';
    const theme = params.get('theme') || 'dark';

    if (theme === 'light') {
      document.documentElement.classList.add('light');
    }

    const iconBox = document.getElementById('icon-box');
    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');
    const errEl = document.getElementById('err-code');
    const tipText = document.getElementById('tip-text');
    const btnDetails = document.getElementById('btn-details');
    const btnPrimary = document.getElementById('btn-primary');
    const btnBack = document.getElementById('btn-back');
    const detailsBox = document.getElementById('details-box');
    const detailsText = document.getElementById('details-text');
    const btnProceed = document.getElementById('btn-proceed');

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    if (type === 'cert') {
      document.body.className = 'mode-cert';
      iconBox.innerHTML = `<svg viewBox="0 0 64 64" width="56" height="56" fill="none">
        <path d="M32 8L6 54h52L32 8z" fill="#dc2626"/>
        <rect x="29.5" y="24" width="5" height="16" rx="2.5" fill="#ffffff"/>
        <circle cx="32" cy="46.5" r="2.8" fill="#ffffff"/>
      </svg>`;
      titleEl.textContent = 'Bağlantınız gizli değil';
      descEl.innerHTML = `Saldırganlar, <strong>${escapeHtml(host)}</strong> sitesindeki bilgilerinizi (örneğin şifreler, iletiler veya kredi kartı numaranızı) çalmaya çalışıyor olabilir.`;
      errEl.style.display = 'block';
      errEl.textContent = errCode;
      tipText.textContent = 'Bu sayfanın SSL güvenlik sertifikası doğrulanamadı veya süresi dolmuş olabilir.';
      btnDetails.textContent = 'Gelişmiş';
      btnPrimary.textContent = 'Yeniden Yükle';
      btnBack.style.display = 'inline-block';
      detailsText.innerHTML = `<strong>Sunucu:</strong> ${escapeHtml(host)}<br/><strong>Hata Kodu:</strong> ${escapeHtml(errCode)}${issuer ? `<br/><strong>Sertifika Sağlayıcısı:</strong> ${escapeHtml(issuer)}` : ''}<br/>Bu bağlantı şifrelenmemiş veya güvenilmeyen bir sertifikayla korunuyor olabilir.`;
      btnProceed.textContent = `${host} sitesine ilerle (güvenli değil)`;

      btnPrimary.onclick = () => {
        window.location.href = 'poly-action://reload?url=' + encodeURIComponent(targetUrl);
      };
      btnBack.onclick = () => {
        window.location.href = 'poly-action://safe';
      };
    } else {
      document.body.className = 'mode-danger';
      iconBox.innerHTML = `<svg viewBox="0 0 64 64" width="58" height="58" fill="none">
        <polygon points="21,6 43,6 58,21 58,43 43,58 21,58 6,43 6,21" fill="#ffffff"/>
        <path d="M23 23L41 41M41 23L23 41" stroke="#a61b1b" stroke-width="5.5" stroke-linecap="round"/>
      </svg>`;
      titleEl.textContent = 'Tehlikeli site';
      descEl.innerHTML = `Ziyaret etmeye çalıştığınız <strong>${escapeHtml(host)}</strong> sitesindeki saldırganlar; şifreniz, fotoğraflarınız, mesajlarınız veya kredi kartı numaranız gibi bilgileri çalan ya da silen zararlı yazılımlar yükleyebilir. Poly Tarayıcı, güvenli bir alana dönmenizi önemle tavsiye eder.`;
      tipText.textContent = 'Poly Güvenli Tarama koruması etkin: Zararlı yazılım ve kimlik avı (phishing) sayfaları yüklenmeden engellenir.';
      btnDetails.textContent = 'Ayrıntılar';
      btnPrimary.textContent = 'Güvenliğe geri dön';
      detailsText.innerHTML = `<strong>Engellenen Adres:</strong> ${escapeHtml(targetUrl)}<br/><strong>Tespit:</strong> ${escapeHtml(reason)}<br/>Sitenin güvenilir olduğundan tamamen emin değilseniz devam etmeyin.`;
      btnProceed.textContent = 'Bu güvensiz siteye devam et (riskli)';

      btnPrimary.onclick = () => {
        window.location.href = 'poly-action://safe';
      };
    }

    btnDetails.onclick = () => {
      detailsBox.classList.toggle('open');
    };

    btnProceed.onclick = () => {
      window.location.href = `poly-action://proceed?type=${encodeURIComponent(type)}&url=${encodeURIComponent(targetUrl)}`;
    };
  </script>
</body>
</html>
