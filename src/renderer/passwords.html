<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Poly Şifre Yöneticisi</title>
  <style>
    :root {
      --bg: #171821;
      --surface: #20222e;
      --surface-hover: #282b3a;
      --border: rgba(255, 255, 255, 0.08);
      --text: #eef0f7;
      --text-sec: #9ba3bc;
      --accent: #7c5cff;
      --accent-soft: rgba(124, 92, 255, 0.16);
      --input-bg: #12131b;
    }
    html.light, html[data-theme='light'] {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-hover: #f8fafc;
      --border: rgba(15, 23, 42, 0.1);
      --text: #0f172a;
      --text-sec: #475569;
      --input-bg: #f1f5f9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; }
    html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Chrome Password Manager Top Header */
    .topbar {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 230px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .search-wrap {
      flex: 1;
      max-width: 560px;
      height: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      transition: border-color 0.15s ease;
    }
    .search-wrap:focus-within {
      border-color: var(--accent);
    }
    .search-wrap input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 13.5px;
    }
    .search-wrap input::placeholder { color: var(--text-sec); }

    /* Body Layout: Left Rail + Main Content */
    .layout {
      flex: 1;
      display: flex;
      min-height: 0;
      padding-top: 8px;
    }
    .nav-rail {
      width: 248px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      border: 1px solid transparent;
      border-radius: 99px;
      background: transparent;
      color: var(--text-sec);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-item:hover {
      background: var(--surface);
      color: var(--text);
    }
    .nav-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }

    .main-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 36px 48px 24px;
    }
    .content-col {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .section-head h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-sec);
      margin-top: 4px;
      line-height: 1.5;
    }

    .btn-pill {
      padding: 8px 18px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-pill:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .btn-pill.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .btn-pill.primary:hover { opacity: 0.92; }
    .btn-pill.danger {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.35);
    }
    .btn-pill.danger:hover {
      background: rgba(239, 68, 68, 0.12);
    }

    .group-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .site-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background 0.12s ease;
    }
    .site-row:last-child { border-bottom: none; }
    .site-row:hover { background: var(--surface-hover); }

    .site-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .site-fav {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      overflow: hidden;
      flex-shrink: 0;
    }
    .site-fav img { width: 18px; height: 18px; border-radius: 3px; }
    .site-domain {
      font-size: 13.5px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .site-count {
      font-size: 12px;
      color: var(--text-sec);
      margin-left: 10px;
    }

    /* Account Detail Card */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
    }
    .back-btn:hover { color: var(--accent); }

    .cred-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .field-label {
      font-size: 11.5px;
      color: var(--text-sec);
      margin-bottom: 5px;
    }
    .field-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
    }
    .field-box input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 13.5px;
      font-family: inherit;
    }
    .icon-btn {
      padding: 5px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sec);
      font-size: 11.5px;
      cursor: pointer;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); }

    /* Settings Rows */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-title { font-size: 13.5px; font-weight: 500; }
    .setting-desc { font-size: 12px; color: var(--text-sec); margin-top: 3px; line-height: 1.4; }

    /* Toggle Switch matching Poly UI */
    .poly-switch { position: relative; display: inline-block; width: 42px; height: 22px; flex-shrink: 0; }
    .poly-switch input { opacity: 0; width: 0; height: 0; }
    .poly-slider {
      position: absolute; inset: 0; border-radius: 99px;
      background: rgba(148, 163, 184, 0.28); cursor: pointer;
      transition: background 0.22s ease;
    }
    .poly-slider::before {
      content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
      border-radius: 50%; background: #fff;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .poly-switch input:checked + .poly-slider { background: var(--accent); }
    .poly-switch input:checked + .poly-slider::before { transform: translateX(20px); }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px 18px;
    }
    .poly-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .poly-input:focus { border-color: var(--accent); }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 9px 18px;
      border-radius: 99px;
      font-size: 12.5px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 50;
    }

    /* Add/Edit Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    .modal h2 { font-size: 17px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7.5" cy="15.5" r="4.5" />
            <path d="M10.8 12.2L20 3" />
            <path d="M16 7l3 3" />
          </svg>
        </span>
        <span>Poly Şifre Yöneticisi</span>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.6">
          <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input id="search-input" type="text" placeholder="Şifrelerde arayın" />
      </div>
      <div style="min-width:120px;"></div>
    </header>

    <div class="layout">
      <aside class="nav-rail">
        <button type="button" class="nav-item active" data-tab="passwords">
          <span class="nav-left">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.8 12.2L20 3"/><path d="M16 7l3 3"/></svg>
            <span>Şifreler</span>
          </span>
        </button>
        <button type="button" class="nav-item" data-tab="checkup">
          <span class="nav-left">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>Kontrol</span>
          </span>
          <span class="nav-badge" id="checkup-badge" style="display:none">0</span>
        </button>
        <button type="button" class="nav-item" data-tab="settings">
          <span class="nav-left">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Ayarlar</span>
          </span>
        </button>
      </aside>

      <main class="main-scroll">
        <div class="content-col" id="content-col"></div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="pw-modal">
    <div class="modal">
      <h2 id="modal-title">Yeni şifre ekle</h2>
      <div>
        <div class="field-label">Site</div>
        <input class="poly-input" id="m-url" placeholder="https://example.com" />
      </div>
      <div>
        <div class="field-label">Kullanıcı adı veya e-posta</div>
        <input class="poly-input" id="m-user" placeholder="kullanici@ornek.com" />
      </div>
      <div>
        <div class="field-label">Şifre</div>
        <input class="poly-input" id="m-pass" type="password" placeholder="Şifre" />
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
        <button type="button" class="btn-pill" id="m-cancel">İptal</button>
        <button type="button" class="btn-pill primary" id="m-save">Kaydet</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    window.applyThemeLive = (theme) => {
      const isLight = theme === 'light';
      document.documentElement.classList.toggle('light', isLight);
      document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
    };
    window.applyAccentLive = (color) => {
      if (!color) return;
      document.documentElement.style.setProperty('--accent', color);
      if (color.startsWith('#') && color.length === 7) {
        const r = parseInt(color.slice(1, 3), 16);
        const g = parseInt(color.slice(3, 5), 16);
        const b = parseInt(color.slice(5, 7), 16);
        document.documentElement.style.setProperty('--accent-soft', `rgba(${r}, ${g}, ${b}, 0.16)`);
      }
    };
    window.applyThemeLive(params.get('theme') || 'dark');
    window.applyAccentLive(params.get('accent') || '#7c5cff');

    let activeTab = 'passwords';
    let selectedOrigin = null;
    let passwords = [];
    let profile = { fullName: '', email: '', phone: '', address: '', city: '', zip: '' };
    let settings = { autofillEnabled: true };
    let checkupData = { total: 0, weak: [], reused: [] };
    let searchQuery = '';

    const contentEl = document.getElementById('content-col');
    const searchEl = document.getElementById('search-input');
    const toastEl = document.getElementById('toast');
    const modalEl = document.getElementById('pw-modal');
    const checkupBadge = document.getElementById('checkup-badge');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { toastEl.style.display = 'none'; }, 2400);
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function getHostLabel(originOrUrl) {
      try {
        return new URL(originOrUrl).hostname.replace(/^www\./, '');
      } catch (_) {
        return String(originOrUrl || '').replace(/^https?:\/\//i, '');
      }
    }

    function openAddModal(prefill = {}) {
      document.getElementById('modal-title').textContent = prefill.url ? 'Şifreyi düzenle' : 'Yeni şifre ekle';
      document.getElementById('m-url').value = prefill.url || '';
      document.getElementById('m-user').value = prefill.username || '';
      document.getElementById('m-pass').value = prefill.password || '';
      modalEl.classList.add('open');
    }

    document.getElementById('m-cancel').onclick = () => modalEl.classList.remove('open');
    document.getElementById('m-save').onclick = async () => {
      const url = document.getElementById('m-url').value.trim();
      const username = document.getElementById('m-user').value.trim();
      const password = document.getElementById('m-pass').value;
      if (!url || !password) {
        showToast('Site adresi ve şifre zorunludur.');
        return;
      }
      passwords = await window.polyPasswordsAPI.save({ url, username, password });
      checkupData = await window.polyPasswordsAPI.checkup();
      updateCheckupBadge();
      modalEl.classList.remove('open');
      showToast('Şifre güvenli kasaya kaydedildi.');
      render();
    };

    function updateCheckupBadge() {
      const issues = (checkupData.weak?.length || 0) + (checkupData.reused?.length || 0);
      if (issues > 0) {
        checkupBadge.textContent = String(issues);
        checkupBadge.style.display = 'inline-block';
      } else {
        checkupBadge.style.display = 'none';
      }
    }

    document.querySelectorAll('.nav-item').forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll('.nav-item').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        selectedOrigin = null;
        render();
      };
    });

    searchEl.oninput = (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      selectedOrigin = null;
      if (activeTab !== 'passwords') {
        activeTab = 'passwords';
        document.querySelectorAll('.nav-item').forEach((b) => b.classList.toggle('active', b.dataset.tab === 'passwords'));
      }
      render();
    };

    function render() {
      contentEl.innerHTML = '';

      if (activeTab === 'passwords') {
        if (selectedOrigin) {
          renderOriginDetail(selectedOrigin);
          return;
        }
        const head = document.createElement('div');
        head.className = 'section-head';
        head.innerHTML = `
          <div>
            <h1>Şifreler</h1>
            <div class="subtitle">Sitelerde kolayca oturum açabilmek için şifrelerinizi oluşturun, kaydedin ve yönetin.</div>
          </div>
          <button type="button" class="btn-pill" id="btn-add-pw">Ekle</button>
        `;
        head.querySelector('#btn-add-pw').onclick = () => openAddModal();
        contentEl.appendChild(head);

        const filtered = passwords.filter((p) => {
          if (!searchQuery) return true;
          return (p.origin || '').toLowerCase().includes(searchQuery) || (p.username || '').toLowerCase().includes(searchQuery);
        });

        const groups = new Map();
        for (const p of filtered) {
          const host = getHostLabel(p.origin || p.url);
          if (!groups.has(host)) groups.set(host, []);
          groups.get(host).push(p);
        }
        const sortedHosts = Array.from(groups.keys()).sort((a, b) => a.localeCompare(b));

        if (sortedHosts.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'cred-card';
          empty.innerHTML = `<div class="subtitle" style="margin:0">Henüz kayıtlı şifre yok. <strong>Ekle</strong> butonundan yeni şifre ekleyebilir veya <strong>Ayarlar</strong> üzerinden şifre CSV'si içe aktarabilirsiniz.</div>`;
          contentEl.appendChild(empty);
          return;
        }

        const card = document.createElement('div');
        card.className = 'group-card';
        for (const host of sortedHosts) {
          const accs = groups.get(host);
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'site-row';
          const favUrl = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=32`;
          row.innerHTML = `
            <span class="site-left">
              <span class="site-fav"><img src="${favUrl}" alt="" onerror="this.remove();this.parentElement.textContent='${escapeHtml(host.charAt(0).toUpperCase())}'"/></span>
              <span class="site-domain">${escapeHtml(host)}</span>
              ${accs.length > 1 ? `<span class="site-count">${accs.length} hesap</span>` : ''}
            </span>
            <span style="opacity:0.55;font-size:14px;">▸</span>
          `;
          row.onclick = () => {
            selectedOrigin = host;
            render();
          };
          card.appendChild(row);
        }
        contentEl.appendChild(card);
      } else if (activeTab === 'checkup') {
        const head = document.createElement('div');
        head.innerHTML = `
          <h1>Şifre Kontrolü</h1>
          <div class="subtitle">Kayıtlı ${checkupData.total} şifreniz zayıf veya birden fazla sitede tekrar kullanılan parolalar için taranır.</div>
        `;
        contentEl.appendChild(head);

        const weakCard = document.createElement('div');
        weakCard.className = 'group-card';
        weakCard.innerHTML = `
          <div class="setting-row">
            <div>
              <div class="setting-title">Zayıf şifreler (${checkupData.weak.length})</div>
              <div class="setting-desc">${checkupData.weak.length === 0 ? '8 karakterden kısa zayıf şifre bulunmadı.' : 'Tahmin edilmesi kolay kısa şifreleri güncellemeniz önerilir.'}</div>
            </div>
          </div>
          <div class="setting-row">
            <div>
              <div class="setting-title">Yeniden kullanılan şifreler (${checkupData.reused.length})</div>
              <div class="setting-desc">${checkupData.reused.length === 0 ? 'Aynı şifreyi kullanan farklı hesap bulunmadı.' : 'Birden fazla sitede aynı şifreyi kullanmak risk oluşturabilir.'}</div>
            </div>
          </div>
        `;
        contentEl.appendChild(weakCard);

        const issues = [
          ...checkupData.weak.map((w) => ({ ...w, label: 'Zayıf şifre' })),
          ...checkupData.reused.map((r) => ({ ...r, label: 'Tekrar kullanılan şifre' }))
        ];
        if (issues.length > 0) {
          const list = document.createElement('div');
          list.className = 'group-card';
          for (const iss of issues) {
            const row = document.createElement('button');
            row.type = 'button';
            row.className = 'site-row';
            const host = getHostLabel(iss.origin);
            row.innerHTML = `
              <span class="site-left">
                <span class="site-domain">${escapeHtml(host)}</span>
                <span class="site-count">${escapeHtml(iss.username || '')} • ${iss.label}</span>
              </span>
              <span style="color:var(--accent);font-size:12px;font-weight:600;">Güncelle ▸</span>
            `;
            row.onclick = () => {
              activeTab = 'passwords';
              selectedOrigin = host;
              document.querySelectorAll('.nav-item').forEach((b) => b.classList.toggle('active', b.dataset.tab === 'passwords'));
              render();
            };
            list.appendChild(row);
          }
          contentEl.appendChild(list);
        }
      } else if (activeTab === 'settings') {
        const head = document.createElement('div');
        head.innerHTML = `<h1>Ayarlar</h1>`;
        contentEl.appendChild(head);

        const card = document.createElement('div');
        card.className = 'group-card';
        card.innerHTML = `
          <div class="setting-row">
            <div>
              <div class="setting-title">Oturumu otomatik olarak doldur</div>
              <div class="setting-desc">Giriş sayfaları açıldığında kayıtlı şifre ve form bilgilerini otomatik olarak doldurur.</div>
            </div>
            <label class="poly-switch">
              <input type="checkbox" id="s-autofill" ${settings.autofillEnabled !== false ? 'checked' : ''} />
              <span class="poly-slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <div>
              <div class="setting-title">Şifreleri içe aktar</div>
              <div class="setting-desc">Chrome, Edge veya Firefox üzerinden dışa aktarılan şifre (.csv) dosyasını seçin.</div>
            </div>
            <button type="button" class="btn-pill" id="s-import-csv">Dosyayı seç</button>
          </div>
          <div class="setting-row">
            <div>
              <div class="setting-title">Şifreleri dışa aktar</div>
              <div class="setting-desc">Kayıtlı Poly şifrelerinizi .csv dosyası olarak bilgisayarınıza indirin.</div>
            </div>
            <button type="button" class="btn-pill" id="s-export-csv">Dosyayı indir</button>
          </div>
          <div class="setting-row">
            <div>
              <div class="setting-title">Tüm Poly Şifre Yöneticisi verilerini sil</div>
              <div class="setting-desc">Kayıtlı tüm şifreler şifreli kasadan kalıcı olarak silinir.</div>
            </div>
            <button type="button" class="btn-pill danger" id="s-clear-all">Verileri sil</button>
          </div>
        `;

        card.querySelector('#s-autofill').onchange = async (e) => {
          settings = await window.polyPasswordsAPI.updateSettings({ autofillEnabled: e.target.checked });
        };
        card.querySelector('#s-import-csv').onclick = async () => {
          const res = await window.polyPasswordsAPI.importCsv();
          if (res && res.ok) {
            passwords = await window.polyPasswordsAPI.list();
            checkupData = await window.polyPasswordsAPI.checkup();
            updateCheckupBadge();
            showToast(`${res.added} yeni şifre içe aktarıldı, ${res.updated} güncellendi.`);
          } else if (res && !res.canceled) {
            showToast(res.error || 'CSV içe aktarılamadı.');
          }
        };
        card.querySelector('#s-export-csv').onclick = async () => {
          const res = await window.polyPasswordsAPI.exportCsv();
          if (res && res.ok) {
            showToast(`${res.count} şifre CSV olarak dışa aktarıldı.`);
          }
        };
        let confirmClear = false;
        card.querySelector('#s-clear-all').onclick = async (e) => {
          if (!confirmClear) {
            confirmClear = true;
            e.target.textContent = 'Emin misiniz? Tıkla';
            setTimeout(() => { confirmClear = false; e.target.textContent = 'Verileri sil'; }, 3000);
            return;
          }
          passwords = await window.polyPasswordsAPI.clearAll();
          checkupData = await window.polyPasswordsAPI.checkup();
          updateCheckupBadge();
          showToast('Tüm şifre verileri silindi.');
          render();
        };
        contentEl.appendChild(card);

        // Kişisel Bilgiler (Form Oto Doldurma Profili)
        const profCard = document.createElement('div');
        profCard.className = 'group-card';
        profCard.innerHTML = `
          <div class="setting-row">
            <div>
              <div class="setting-title">Kişisel Bilgilerim (Form Oto Doldurma)</div>
              <div class="setting-desc">Adres, e-posta ve telefon isteyen formlarda kullanılmak üzere profil bilgilerinizi saklayın.</div>
            </div>
            <button type="button" class="btn-pill primary" id="s-save-profile">Kaydet</button>
          </div>
          <div class="profile-grid">
            <input class="poly-input" id="p-name" placeholder="Ad Soyad" value="${escapeHtml(profile.fullName || '')}" />
            <input class="poly-input" id="p-email" placeholder="E-posta" value="${escapeHtml(profile.email || '')}" />
            <input class="poly-input" id="p-phone" placeholder="Telefon" value="${escapeHtml(profile.phone || '')}" />
            <input class="poly-input" id="p-addr" placeholder="Adres" value="${escapeHtml(profile.address || '')}" />
            <input class="poly-input" id="p-city" placeholder="Şehir" value="${escapeHtml(profile.city || '')}" />
            <input class="poly-input" id="p-zip" placeholder="Posta Kodu" value="${escapeHtml(profile.zip || '')}" />
          </div>
        `;
        profCard.querySelector('#s-save-profile').onclick = async () => {
          profile = await window.polyPasswordsAPI.saveProfile({
            fullName: profCard.querySelector('#p-name').value.trim(),
            email: profCard.querySelector('#p-email').value.trim(),
            phone: profCard.querySelector('#p-phone').value.trim(),
            address: profCard.querySelector('#p-addr').value.trim(),
            city: profCard.querySelector('#p-city').value.trim(),
            zip: profCard.querySelector('#p-zip').value.trim()
          });
          showToast('Kişisel oto doldurma profili kaydedildi.');
        };
        contentEl.appendChild(profCard);
      }
    }

    function renderOriginDetail(host) {
      const head = document.createElement('div');
      head.className = 'section-head';
      const backBtn = document.createElement('button');
      backBtn.type = 'button';
      backBtn.className = 'back-btn';
      backBtn.innerHTML = `← <span>${escapeHtml(host)}</span>`;
      backBtn.onclick = () => { selectedOrigin = null; render(); };

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'btn-pill';
      addBtn.textContent = 'Hesap Ekle';
      addBtn.onclick = () => openAddModal({ url: `https://${host}` });
      head.append(backBtn, addBtn);
      contentEl.appendChild(head);

      const items = passwords.filter((p) => getHostLabel(p.origin || p.url) === host);
      for (const acc of items) {
        const card = document.createElement('div');
        card.className = 'cred-card';
        card.innerHTML = `
          <div>
            <div class="field-label">Site Adresi</div>
            <div class="field-box"><input type="text" readonly value="${escapeHtml(acc.origin || acc.url)}" /></div>
          </div>
          <div>
            <div class="field-label">Kullanıcı adı</div>
            <div class="field-box">
              <input type="text" readonly value="${escapeHtml(acc.username)}" id="u-${acc.id}" />
              <button type="button" class="icon-btn" id="copy-u-${acc.id}">Kopyala</button>
            </div>
          </div>
          <div>
            <div class="field-label">Şifre</div>
            <div class="field-box">
              <input type="password" readonly value="••••••••••••" id="p-${acc.id}" />
              <button type="button" class="icon-btn" id="eye-${acc.id}">Göster</button>
              <button type="button" class="icon-btn" id="copy-p-${acc.id}">Kopyala</button>
            </div>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" class="btn-pill" id="edit-${acc.id}">Düzenle</button>
            <button type="button" class="btn-pill danger" id="del-${acc.id}">Sil</button>
          </div>
        `;

        card.querySelector(`#copy-u-${acc.id}`).onclick = () => {
          navigator.clipboard?.writeText(acc.username || '').catch(() => {});
          showToast('Kullanıcı adı kopyalandı.');
        };
        const passInput = card.querySelector(`#p-${acc.id}`);
        const eyeBtn = card.querySelector(`#eye-${acc.id}`);
        let revealedPlain = null;

        eyeBtn.onclick = async () => {
          if (passInput.type === 'password') {
            if (revealedPlain === null) revealedPlain = await window.polyPasswordsAPI.reveal(acc.id);
            passInput.value = revealedPlain;
            passInput.type = 'text';
            eyeBtn.textContent = 'Gizle';
          } else {
            passInput.type = 'password';
            passInput.value = '••••••••••••';
            eyeBtn.textContent = 'Göster';
          }
        };
        card.querySelector(`#copy-p-${acc.id}`).onclick = async () => {
          if (revealedPlain === null) revealedPlain = await window.polyPasswordsAPI.reveal(acc.id);
          navigator.clipboard?.writeText(revealedPlain || '').catch(() => {});
          showToast('Şifre panoya kopyalandı.');
        };
        card.querySelector(`#edit-${acc.id}`).onclick = async () => {
          if (revealedPlain === null) revealedPlain = await window.polyPasswordsAPI.reveal(acc.id);
          openAddModal({ url: acc.origin || acc.url, username: acc.username, password: revealedPlain });
        };
        card.querySelector(`#del-${acc.id}`).onclick = async () => {
          passwords = await window.polyPasswordsAPI.remove(acc.id);
          checkupData = await window.polyPasswordsAPI.checkup();
          updateCheckupBadge();
          showToast('Kayıt silindi.');
          if (!passwords.some((p) => getHostLabel(p.origin || p.url) === host)) {
            selectedOrigin = null;
          }
          render();
        };
        contentEl.appendChild(card);
      }
    }

    (async function init() {
      if (window.polyPasswordsAPI) {
        const initData = await window.polyPasswordsAPI.getInitial();
        passwords = initData.passwords || [];
        profile = initData.profile || profile;
        settings = initData.settings || settings;
        checkupData = initData.checkup || checkupData;
        updateCheckupBadge();
      }
      render();
    })();
  </script>
</body>
</html>
