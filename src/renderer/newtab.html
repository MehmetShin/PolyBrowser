<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni Sekme</title>
  <style>
    :root {
      --accent: #7c5cff;
      --accent-soft: rgba(124, 92, 255, 0.22);
      --accent-border: rgba(124, 92, 255, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #191c2b 0%, #0b0c10 70%);
      color: #eef0f7;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .clock-wrap {
      text-align: center;
    }

    .clock {
      font-size: 58px;
      font-weight: 700;
      letter-spacing: -1.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .date {
      font-size: 14px;
      color: #9299b0;
      margin-top: 4px;
    }

    .speed-dial {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 14px;
      margin-top: 8px;
    }

    .dial-card {
      position: relative;
      text-decoration: none;
      color: #eef0f7;
      background: rgba(25, 28, 40, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .dial-card:hover {
      transform: translateY(-3px);
      background: rgba(34, 38, 54, 0.92);
      border-color: var(--accent-border);
    }

    .dial-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .dial-card:hover .dial-actions,
    .dial-card:focus-within .dial-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .dial-act-btn {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 17, 26, 0.85);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }

    .dial-act-btn:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: transparent;
    }

    .dial-act-btn.del:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .dial-card.add-card {
      background: rgba(25, 28, 40, 0.35);
      border: 1px dashed rgba(255, 255, 255, 0.18);
    }

    .dial-card.add-card:hover {
      background: rgba(34, 38, 54, 0.72);
      border-color: var(--accent);
      border-style: solid;
    }

    .dial-card.add-card .dial-icon {
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 22px;
    }

    .dial-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      overflow: hidden;
    }

    .dial-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 8px;
    }

    .dial-label {
      font-size: 12.5px;
      font-weight: 500;
      color: #cfd5e6;
    }

    html.light body,
    html[data-theme='light'] body {
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, #f0f3f8 85%) !important;
      color: #0f172a !important;
    }

    html.light .clock,
    html[data-theme='light'] .clock {
      background: linear-gradient(135deg, #0f172a 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    html.light .date,
    html[data-theme='light'] .date {
      color: #475569;
    }

    html.light .dial-card,
    html[data-theme='light'] .dial-card {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(15, 23, 42, 0.08);
      color: #0f172a;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    }

    html.light .dial-card:hover,
    html[data-theme='light'] .dial-card:hover {
      background: #ffffff;
      border-color: var(--accent-border);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
    }

    html.light .dial-icon,
    html[data-theme='light'] .dial-icon {
      background: rgba(15, 23, 42, 0.05);
    }

    html.light .dial-label,
    html[data-theme='light'] .dial-label {
      color: #334155;
    }

    .badge {
      font-size: 12px;
      color: #7c849d;
      margin-top: 10px;
    }

    .dial-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: -10px;
      font-size: 12px;
      color: #7c849d;
    }

    .dial-tool-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #9299b0;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .dial-tool-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #eef0f7;
      border-color: var(--accent-border);
    }

    html.light .dial-act-btn,
    html[data-theme='light'] .dial-act-btn {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(15, 23, 42, 0.12);
      color: #334155;
    }

    html.light .dial-card.add-card,
    html[data-theme='light'] .dial-card.add-card {
      background: rgba(255, 255, 255, 0.55);
      border-color: rgba(15, 23, 42, 0.18);
    }

    html.light .dial-tool-btn,
    html[data-theme='light'] .dial-tool-btn {
      border-color: rgba(15, 23, 42, 0.12);
      color: #475569;
    }

    html.light .dial-tool-btn:hover,
    html[data-theme='light'] .dial-tool-btn:hover {
      background: rgba(15, 23, 42, 0.05);
      color: #0f172a;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: #171a26;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    html.light .modal-card,
    html[data-theme='light'] .modal-card {
      background: #ffffff;
      border-color: rgba(15, 23, 42, 0.12);
      color: #0f172a;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      color: #9299b0;
    }

    .field-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: inherit;
      font-size: 13px;
      outline: none;
    }

    .field-input:focus {
      border-color: var(--accent);
    }

    html.light .field-input,
    html[data-theme='light'] .field-input {
      background: #f8fafc;
      border-color: rgba(15, 23, 42, 0.14);
      color: #0f172a;
    }

    .field-error {
      font-size: 12px;
      color: #f87171;
      min-height: 16px;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
    }

    .modal-right {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .m-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: inherit;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .m-btn.primary {
      background: var(--accent);
      border-color: transparent;
      color: #ffffff;
    }

    .m-btn.danger {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.35);
      color: #f87171;
    }

    html.light .m-btn:not(.primary):not(.danger),
    html[data-theme='light'] .m-btn:not(.primary):not(.danger) {
      background: #f1f5f9;
      border-color: rgba(15, 23, 42, 0.12);
      color: #0f172a;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="clock-wrap">
      <div class="clock" id="clock">00:00</div>
      <div class="date" id="date">Poly Tarayıcı</div>
    </div>

    <div class="speed-dial" id="speed-dial"></div>
    <div class="dial-toolbar" id="dial-toolbar">
      <span id="dial-count">0 / 6 kısayol</span>
      <button type="button" class="dial-tool-btn" id="btn-add-shortcut">+ Site Ekle</button>
      <button type="button" class="dial-tool-btn" id="btn-reset-shortcuts">Varsayılanlar</button>
    </div>
  </div>

  <div class="modal-backdrop" id="dial-modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-title" id="modal-title">Site Ekle</div>
      <div class="field-group">
        <label class="field-label" for="dial-title-input">Site Adı (isteğe bağlı)</label>
        <input class="field-input" id="dial-title-input" type="text" maxlength="32" placeholder="Örn: Instagram" />
      </div>
      <div class="field-group">
        <label class="field-label" for="dial-url-input">Site Adresi (URL)</label>
        <input class="field-input" id="dial-url-input" type="text" placeholder="Örn: instagram.com" />
      </div>
      <div class="field-error" id="dial-error"></div>
      <div class="modal-footer">
        <button type="button" class="m-btn danger" id="btn-modal-delete" style="display:none">Sil</button>
        <div class="modal-right">
          <button type="button" class="m-btn" id="btn-modal-cancel">İptal</button>
          <button type="button" class="m-btn primary" id="btn-modal-save">Kaydet</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function applyThemeLive(theme) {
      if (theme === 'light') {
        document.documentElement.classList.add('light');
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    }
    window.applyThemeLive = applyThemeLive;

    function applyAccentLive(color) {
      if (!color || !/^#[0-9a-f]{6}$/i.test(color)) return;
      const r = parseInt(color.slice(1, 3), 16);
      const g = parseInt(color.slice(3, 5), 16);
      const b = parseInt(color.slice(5, 7), 16);
      document.documentElement.style.setProperty('--accent', color);
      document.documentElement.style.setProperty('--accent-soft', `rgba(${r}, ${g}, ${b}, 0.22)`);
      document.documentElement.style.setProperty('--accent-border', `rgba(${r}, ${g}, ${b}, 0.45)`);
    }
    window.applyAccentLive = applyAccentLive;

    const params = new URLSearchParams(window.location.search);
    const themeParam = params.get('theme');
    applyThemeLive(themeParam === 'light' ? 'light' : 'dark');
    if (params.get('accent')) {
      applyAccentLive(params.get('accent'));
    }
    if (params.get('clock') === '0') {
      document.querySelector('.clock-wrap')?.remove();
    }
    if (params.get('dial') === '0') {
      document.querySelector('.speed-dial')?.remove();
      document.getElementById('dial-toolbar')?.remove();
    } else {
      initSpeedDial();
    }

    function initSpeedDial() {
      const MAX_DIALS = 6;
      const DEFAULT_DIALS = [
        { title: 'Google', url: 'https://www.google.com', color: '#4285F4' },
        { title: 'YouTube', url: 'https://www.youtube.com', color: '#FF0000' },
        { title: 'GitHub', url: 'https://github.com', color: '#8b5cf6' },
        { title: 'Wikipedia', url: 'https://tr.wikipedia.org', color: '#64748b' },
        { title: 'Reddit', url: 'https://www.reddit.com', color: '#FF4500' },
        { title: 'Twitch', url: 'https://www.twitch.tv', color: '#9146FF' }
      ];

      const dialGrid = document.getElementById('speed-dial');
      const countEl = document.getElementById('dial-count');
      const btnAdd = document.getElementById('btn-add-shortcut');
      const btnReset = document.getElementById('btn-reset-shortcuts');
      const modal = document.getElementById('dial-modal');
      const modalTitle = document.getElementById('modal-title');
      const titleInput = document.getElementById('dial-title-input');
      const urlInput = document.getElementById('dial-url-input');
      const errorEl = document.getElementById('dial-error');
      const btnDelete = document.getElementById('btn-modal-delete');
      const btnCancel = document.getElementById('btn-modal-cancel');
      const btnSave = document.getElementById('btn-modal-save');

      let dials = [];
      let editIndex = -1;

      function normalizeUrl(raw) {
        let s = String(raw || '').trim();
        if (!s) return null;
        if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
        try {
          const u = new URL(s);
          if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
          if (!u.hostname || !u.hostname.includes('.')) return null;
          return u;
        } catch (_) {
          return null;
        }
      }

      async function persistDials(next) {
        const sliced = next.slice(0, MAX_DIALS);
        if (window.polyNewTabAPI && window.polyNewTabAPI.saveSpeedDial) {
          dials = await window.polyNewTabAPI.saveSpeedDial(sliced);
        } else {
          dials = sliced;
        }
        renderDials();
      }

      function openModal(idx = -1) {
        editIndex = idx;
        errorEl.textContent = '';
        if (idx >= 0 && dials[idx]) {
          modalTitle.textContent = 'Kısayolu Düzenle';
          titleInput.value = dials[idx].title || '';
          urlInput.value = dials[idx].url || '';
          btnDelete.style.display = 'inline-flex';
        } else {
          if (dials.length >= MAX_DIALS) return;
          modalTitle.textContent = 'Site Ekle';
          titleInput.value = '';
          urlInput.value = '';
          btnDelete.style.display = 'none';
        }
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        setTimeout(() => urlInput.focus(), 20);
      }

      function closeModal() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        editIndex = -1;
      }

      function renderDials() {
        if (!dialGrid) return;
        dialGrid.innerHTML = '';

        dials.forEach((item, idx) => {
          const card = document.createElement('a');
          card.className = 'dial-card';
          card.href = item.url;

          const actions = document.createElement('div');
          actions.className = 'dial-actions';

          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'dial-act-btn';
          editBtn.title = 'Düzenle';
          editBtn.textContent = '✎';
          editBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            openModal(idx);
          });

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'dial-act-btn del';
          delBtn.title = 'Kaldır';
          delBtn.textContent = '×';
          delBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const next = dials.filter((_, i) => i !== idx);
            persistDials(next);
          });

          actions.append(editBtn, delBtn);

          const iconWrap = document.createElement('div');
          iconWrap.className = 'dial-icon';
          let domain = '';
          try { domain = new URL(item.url).hostname; } catch (_) {}
          const fallbackChar = (item.title || domain || '?').trim().slice(0, 2).toUpperCase();
          const img = document.createElement('img');
          img.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;
          img.alt = item.title || domain;
          img.onerror = () => {
            iconWrap.textContent = fallbackChar;
            iconWrap.style.background = item.color || 'var(--accent)';
          };
          iconWrap.appendChild(img);

          const label = document.createElement('span');
          label.className = 'dial-label';
          label.textContent = item.title || domain;

          card.append(actions, iconWrap, label);
          dialGrid.appendChild(card);
        });

        if (dials.length < MAX_DIALS) {
          const addCard = document.createElement('button');
          addCard.type = 'button';
          addCard.className = 'dial-card add-card';
          addCard.addEventListener('click', () => openModal(-1));

          const iconWrap = document.createElement('div');
          iconWrap.className = 'dial-icon';
          iconWrap.textContent = '+';

          const label = document.createElement('span');
          label.className = 'dial-label';
          label.textContent = 'Site Ekle';

          addCard.append(iconWrap, label);
          dialGrid.appendChild(addCard);
        }

        if (countEl) countEl.textContent = `${dials.length} / ${MAX_DIALS} kısayol`;
        if (btnAdd) btnAdd.style.display = dials.length < MAX_DIALS ? 'inline-flex' : 'none';
      }

      async function saveFromModal() {
        const parsed = normalizeUrl(urlInput.value);
        if (!parsed) {
          errorEl.textContent = 'Geçerli bir site adresi girin (ör. instagram.com)';
          urlInput.focus();
          return;
        }
        const hostLabel = parsed.hostname.replace(/^www\./i, '');
        const title = titleInput.value.trim().slice(0, 32) || hostLabel;
        const entry = {
          title,
          url: parsed.toString(),
          color: (editIndex >= 0 && dials[editIndex] && dials[editIndex].color) || '#7c5cff'
        };
        const next = dials.slice();
        if (editIndex >= 0 && editIndex < next.length) {
          next[editIndex] = entry;
        } else if (next.length < MAX_DIALS) {
          next.push(entry);
        }
        closeModal();
        await persistDials(next);
      }

      btnAdd?.addEventListener('click', () => openModal(-1));
      btnReset?.addEventListener('click', async () => {
        if (window.polyNewTabAPI && window.polyNewTabAPI.resetSpeedDial) {
          dials = await window.polyNewTabAPI.resetSpeedDial();
        } else {
          dials = DEFAULT_DIALS.slice();
        }
        renderDials();
      });
      btnCancel?.addEventListener('click', closeModal);
      btnSave?.addEventListener('click', saveFromModal);
      btnDelete?.addEventListener('click', async () => {
        if (editIndex >= 0) {
          const next = dials.filter((_, i) => i !== editIndex);
          closeModal();
          await persistDials(next);
        }
      });
      modal?.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', (e) => {
        if (!modal.classList.contains('open')) return;
        if (e.key === 'Escape') closeModal();
        else if (e.key === 'Enter') {
          e.preventDefault();
          saveFromModal();
        }
      });

      if (window.polyNewTabAPI && window.polyNewTabAPI.onSpeedDialUpdated) {
        window.polyNewTabAPI.onSpeedDialUpdated((updated) => {
          if (Array.isArray(updated)) {
            dials = updated.slice(0, MAX_DIALS);
            renderDials();
          }
        });
      }

      if (window.polyNewTabAPI && window.polyNewTabAPI.getSpeedDial) {
        window.polyNewTabAPI.getSpeedDial().then((items) => {
          dials = Array.isArray(items) ? items.slice(0, MAX_DIALS) : DEFAULT_DIALS.slice();
          renderDials();
        }).catch(() => {
          dials = DEFAULT_DIALS.slice();
          renderDials();
        });
      } else {
        dials = DEFAULT_DIALS.slice();
        renderDials();
      }
    }
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('tr-TR', {
        hour: '2-digit',
        minute: '2-digit'
      });
      document.getElementById('date').textContent = now.toLocaleDateString('tr-TR', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      });
    }
    updateClock();
    setInterval(updateClock, 10000);
  </script>
</body>

</html>
